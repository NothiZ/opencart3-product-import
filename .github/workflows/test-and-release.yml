name: Test and release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    name: PHP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: dom, gd, mbstring, zip
          coverage: none

      - name: Run all PHP tests
        shell: bash
        run: |
          shopt -s globstar failglob
          status=0
          for test in tests/**/*_test.php; do
            printf 'Running %s\n' "$test"
            php -d error_reporting=32767 "$test" || status=1
          done
          exit "$status"

  release:
    name: Publish installer
    if: github.ref_type == 'tag' && !github.event.deleted
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build OpenCart installer
        run: python3 build.py "$RUNNER_TEMP/nothiz_product_import_oc3.ocmod.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$VERSION_TAG"
          "$RUNNER_TEMP/nothiz_product_import_oc3.ocmod.zip"
          --verify-tag --generate-notes
